<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarot Table</title>
<meta name="description" content="A cute, simple tarot reading table. Draw cards for yourself or friends, in English or Chinese.">
<meta property="og:title" content="Tarot Table">
<meta property="og:description" content="Draw a card, talk it through. A cute, simple tarot reading site.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Chiron+GoRound+TC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F4F4F4; --ink:#111111; --muted:#777777; --line:#111111;
  --font:"Nunito","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111111;--soft:#1E1E1E;--ink:#F5F5F5;--muted:#9A9A9A;--line:#F5F5F5}
}
:root[data-theme="dark"]{--bg:#111111;--soft:#1E1E1E;--ink:#F5F5F5;--muted:#9A9A9A;--line:#F5F5F5}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 60px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{font-weight:800;font-size:18px;background:none;border:0;padding:0;cursor:pointer}
.brand::before{content:"✦ "}
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.stepper li{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);font-size:0}
.stepper li[aria-current="step"]{background:var(--ink)}

.hero{display:grid;grid-template-columns:1fr 240px;gap:32px;align-items:center}
h1{font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1.2;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 26px}
.field{display:block;margin-bottom:16px}
.field > span{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.field input,.field textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;line-height:1.6}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;box-shadow:3px 3px 0 var(--line)}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:600;margin-bottom:8px;padding:0;font-size:15px}
.spreads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spreads label{display:block;cursor:pointer;border:2px solid var(--line);padding:12px 14px;border-radius:16px;line-height:1.4;transition:transform .12s}
.spreads input{position:absolute;opacity:0;pointer-events:none}
.spreads b{display:block;font-size:16px;font-weight:800;margin-bottom:2px}
.spreads small{color:var(--muted);font-size:13px}
.spreads label:has(input:checked){background:var(--ink);color:var(--bg)}
.spreads label:has(input:checked) small{color:inherit;opacity:.75}
.spreads label:has(input:focus-visible){outline:3px dashed var(--ink);outline-offset:3px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.subq{font-weight:600;font-size:14px;margin:14px 0 8px;color:var(--muted)}
#situ label{font-size:14px;padding:4px 12px}
.topics label{cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;font-size:15px}
.topics input{position:absolute;opacity:0;pointer-events:none}
.topics label:has(input:checked){background:var(--ink);color:var(--bg)}
.topics label:has(input:focus-visible){outline:3px dashed var(--ink);outline-offset:3px}
.entry h4{font-size:13px;font-weight:800;letter-spacing:.04em;margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.entry h4::after{content:"";flex:1;border-top:2px dotted var(--line)}
.entry .sec p{margin:0 0 6px}
.entry .about p:first-child{color:var(--muted)}
.entry .refl{font-weight:600}
.entry .refl::before{content:"✦ "}
.entry .topic{margin-top:8px;padding-top:8px;border-top:2px dotted var(--line)}
.entry .topic b{font-weight:800}
.note{max-width:40em;color:var(--muted);font-size:14px;margin:0 0 12px}
.qhelp{margin:-8px 0 12px;font-size:14px}
.qh-title{margin:0 0 4px;font-weight:600;color:var(--muted);font-size:13.5px}
.qh-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.qh-list li{color:var(--muted)}
.qh-list li::before{content:"○ ";font-weight:800}
.qh-list li.ok{color:var(--ink);font-weight:600}
.qh-list li.ok::before{content:"✓ "}
.qh-warn{margin:8px 0 0;padding:6px 12px;border-radius:12px;background:var(--soft);font-weight:600}
.qchips{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:0 0 20px}
.qchip{background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:5px 12px;font-size:14px;text-align:left;cursor:pointer;line-height:1.45}
.qchip:hover{border-style:solid}
.entry .better{font-weight:600}
.entry .better::before{content:"➚ "}
.check{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:24px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--bg);padding:9px 18px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:600;line-height:1.3;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);font-size:18px;padding:12px 34px;font-weight:800}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--line)}

.deckstage{display:flex;justify-content:center;align-items:center;min-height:300px}
.stack{position:relative;width:150px;height:240px}
.stack .card{--cw:150px;position:absolute;inset:0}
.stack .card:nth-child(1){transform:rotate(-10deg) translate(-22px,6px)}
.stack .card:nth-child(2){transform:rotate(8deg) translate(20px,-2px)}
.stack .card:nth-child(3){transform:rotate(-1deg)}
.stack.shuffling .card:nth-child(1){animation:riffleL .45s ease-in-out 3}
.stack.shuffling .card:nth-child(2){animation:riffleR .45s ease-in-out 3}
@keyframes riffleL{50%{transform:rotate(-18deg) translate(-90px,-10px)}}
@keyframes riffleR{50%{transform:rotate(16deg) translate(90px,-10px)}}

.card{--cw:90px;width:var(--cw);height:calc(var(--cw)*1.6);perspective:900px;font-size:calc(var(--cw)*.14);flex:none}
.card-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1.2)}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw)*.14);overflow:hidden;border:max(2px,calc(var(--cw)*.025)) solid #111;background:#FFF;color:#111}
.back{background:radial-gradient(circle,#111 0 18%,transparent 19%) 0 0/calc(var(--cw)*.2) calc(var(--cw)*.2),#FFF;display:flex;align-items:center;justify-content:center}
.back::after{content:"✦";display:grid;place-items:center;width:42%;aspect-ratio:1;border-radius:50%;background:#FFF;border:max(2px,calc(var(--cw)*.025)) solid #111;font-size:1.6em;line-height:1}
.front{transform:rotateY(180deg);box-shadow:inset 0 0 0 calc(var(--cw)*.035) #FFF,inset 0 0 0 calc(var(--cw)*.035 + 1px) #111}
.front-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7% 5% 7%}
.front-in.rev{transform:rotate(180deg)}
.num{font-weight:800;font-size:.72em;line-height:1;margin-bottom:.15em;letter-spacing:.08em;font-family:Georgia,"Times New Roman",serif}
.num::before,.num::after{content:"✦";font-size:.6em;margin:0 .4em;vertical-align:.15em}
.emblem{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.emblem{min-height:0}
.emblem svg{height:100%;width:100%;max-height:100%}
.emblem img{display:none}
.front-in.hasimg{padding:0}
.front-in.hasimg .num,.front-in.hasimg .kwl,.front-in.hasimg .emblem .art{display:none}
.front-in.hasimg .emblem{position:absolute;inset:0}
.front-in.hasimg .emblem img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 15%;filter:grayscale(1) contrast(1.08)}
.front-in.hasimg .nm{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);z-index:1;box-shadow:0 0 0 2px #FFF;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.kwl{display:none;font-size:.5em;font-weight:700;line-height:1.2;margin-top:.35em;text-align:center;color:#555}
.board.single .kwl{display:block}
@media (min-width:640px){.board.three .kwl{display:block}}
.emblem .glyph{font-weight:800;font-size:2.6em;line-height:1;display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;border:max(2px,calc(var(--cw)*.025)) solid #111}
.nm{font-weight:800;font-size:.85em;line-height:1.1;text-align:center;background:#111;color:#FFF;padding:.35em .7em;border-radius:1em;max-width:100%}
.en .nm{font-size:.62em;padding:.4em .6em}
.en .emblem .glyph{font-size:2.3em}

.pickhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h2{font-weight:800;font-size:clamp(24px,4.5vw,32px);line-height:1.3;margin:0}
.counter{font-weight:800;font-size:20px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 16px}
.fan{display:flex;overflow-x:auto;padding:34px 20px 22px 58px;background:var(--soft);border-radius:24px}
.fan .pick{--cw:74px;margin-left:-48px;background:none;border:0;padding:0;cursor:pointer;transition:transform .18s cubic-bezier(.3,.7,.2,1.4),opacity .3s,margin .3s,width .3s}
.fan .pick:hover,.fan .pick:focus-visible{transform:translateY(-20px) rotate(-3deg)}
.fan .pick.taken{opacity:0;width:0;margin-left:0;pointer-events:none}
.tray{display:flex;gap:8px;margin:18px 0 0;flex-wrap:wrap}
.tray span{width:22px;height:22px;border:2px dashed var(--line);border-radius:50%}
.tray span.on{border-style:solid;background:var(--ink)}

.question{margin:4px 0 0;color:var(--muted)}
.question q{color:var(--ink)}
.board{display:grid;justify-content:center;gap:14px 12px;margin:22px 0;padding:28px 12px;background:var(--soft);border-radius:24px}
.board.single{--cw:clamp(120px,34vw,160px)}
.board.three{--cw:clamp(84px,25vw,130px);grid-template-columns:repeat(3,auto);gap:14px clamp(12px,4vw,36px)}
.board.celtic{--cw:clamp(52px,14vw,86px);grid-template-columns:repeat(3,auto) calc(var(--cw)*.3) auto;
  grid-template-areas:". p3 . . p10" "p5 p1 p6 . p9" ". p4 . . p8" ". . . . p7";gap:10px 8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.slot .card{--cw:inherit;background:none;border:0;padding:0;cursor:pointer}
.board .card{width:var(--cw);height:calc(var(--cw)*1.6)}
.slot .lbl{font-size:13px;text-align:center;line-height:1.3;max-width:calc(var(--cw) + 30px)}
.slot .lbl b{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.85em;margin-right:4px}
.slot.cross{position:absolute;inset:0;z-index:2;pointer-events:none;justify-content:flex-start}
.slot.cross .card{transform:rotate(90deg);pointer-events:auto}
.slot.cross .lbl{display:none}
.center-cell{position:relative;grid-area:p1}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:30px}
.reading{display:grid;gap:12px;max-width:40em}
.entry{border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.entry h3{font-size:20px;margin:2px 0 0;line-height:1.35;font-weight:800}
.entry .pos{display:inline-block;font-size:13px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 10px}
.entry .orient{font-size:14px;color:var(--muted);margin-left:8px;font-weight:400}
.entry .kw{margin:4px 0 2px;font-weight:600;font-size:15px}
.entry p{margin:0}
.empty{color:var(--muted);text-align:center;border:2px dashed var(--line);border-radius:18px;padding:20px;margin:0}
.ai{max-width:40em;margin:0 0 30px;padding:18px 20px;border:2px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line)}
.ai h3{font-size:20px;margin:0 0 8px;font-weight:800}
.ai h3::before{content:"✦ "}
.ai p{margin:0 0 .9em}
.ai .status{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.credit{margin-top:4px!important;font-size:11px!important;opacity:.8}
.foot{margin-top:48px;font-size:13px;color:var(--muted);text-align:center}

@media (max-width:700px){
  .hero{grid-template-columns:1fr}
  .deckstage{order:-1;min-height:220px}
  .stack{width:120px;height:192px}
  .stack .card{--cw:120px}
  .spreads{grid-template-columns:1fr}
  .board.celtic{grid-template-columns:repeat(3,auto) 6px auto;gap:8px 5px}
  .slot .lbl{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top-r{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:var(--bg);border:0;padding:3px 12px;font-size:14px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board.noanim .card-in{transition:none}
.codexBtn{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.guide{max-width:760px}
.guide .lede{margin:6px 0 16px}
.gsec{margin:30px 0 0;scroll-margin-top:16px}
.gsec h3{font-size:22px;font-weight:800;margin:0 0 10px;padding-bottom:6px;border-bottom:2px dotted var(--line)}
.gsec p{margin:0 0 10px}
.gcards{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 14px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;max-width:100px}
.gcard .card{--cw:86px}
.glist{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:4px 0 12px}
.glist dt{font-weight:800}
.glist dd{margin:0}
.gol{margin:4px 0 12px;padding-left:1.4em}
.gol li{margin-bottom:6px}
.guideLink{display:block;margin:-10px auto 16px}
.guide .pickBtns{margin:34px 0 10px}
@media (max-width:640px){.stepper{display:none!important}.glist{grid-template-columns:1fr;gap:2px}.glist dd{margin-bottom:8px}.gcard .card{--cw:70px}}
.top{flex-wrap:nowrap;gap:10px}
.brand{white-space:nowrap;flex:none}
.top-r{flex-wrap:nowrap}
.codexBtn{display:inline-flex;align-items:center;gap:5px;height:32px}
.codexBtn .ico{font-weight:800}
.codexBtn .cnt{font-variant-numeric:tabular-nums}
.lang button{white-space:nowrap}
@media (max-width:640px){
  .wrap{padding-top:16px}
  .top{margin-bottom:18px}
  .brand{font-size:17px}
  .top-r{gap:6px}
  .stepper{display:none!important}
  .codexBtn{height:30px;padding:0 9px;font-size:12.5px;gap:4px}
  .codexBtn .lbl{display:none}
  .guideBtn{width:30px;padding:0;justify-content:center}
  .lang button{padding:0 9px;height:26px;font-size:12.5px}
}
@media (max-width:350px){ .brand{font-size:15px} .brand::before{content:""} .top-r{gap:4px} .codexBtn{padding:0 7px;font-size:11.5px} .guideBtn{width:28px} .lang button{padding:0 7px;font-size:12px} }
.cxhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cxprog{font-weight:700;margin:6px 0 8px}
.cxbar{height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.cxbar span{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--ink) 0 4px,transparent 4px 7px);transition:width .6s}
.cxfilters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.cxf{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;cursor:pointer}
.cxf[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.cxcell{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.cxcell .card{--cw:86px}
.cxcell.locked .card{opacity:.35;filter:grayscale(1)}
.cxcell.locked .face.back::after{content:"?";font-weight:800}
.cxcap{font-size:12.5px;font-weight:600;text-align:center;line-height:1.3}
.cxcell:hover .card{transform:translateY(-3px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modalCard{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:24px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:6px 6px 0 var(--line)}
.modalCard > .btn{margin-top:14px}
.cxdetail{display:flex;gap:18px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.cxinfo h3{margin:4px 0 0;font-size:24px;font-weight:800}
.cxsub{color:var(--muted);margin:2px 0 0;font-size:14px}
.cxdate{font-weight:600;font-size:14px;margin:8px 0 0}
#modalBody p{margin:0 0 10px}
.shareimg{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;border:2px solid var(--line);display:block;margin:0 auto 14px}
.sharebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sharebtns a.btn{text-decoration:none}
@media (max-width:640px){.cxgrid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.cxcell .card{--cw:70px}}

.prep{max-width:640px;margin:0 auto;text-align:center}
.prep h2{margin-bottom:4px}
.warn{border:2px solid var(--line);background:var(--soft);border-radius:16px;padding:10px 14px;font-weight:600;text-align:left;margin:0 0 16px}
.warn::before{content:"⚠︎ "}
.rules{list-style:none;padding:0;margin:0 auto 22px;text-align:left;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.rules li b{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px}
.rules li span{line-height:1.55}
.breath{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 10px}
.bcircle{width:150px;height:150px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:radial-gradient(circle,var(--soft) 0 55%,transparent 56%);transform:scale(.7);transition:transform 4s ease-in-out;font-weight:800;font-size:18px}
.bcircle.in{transform:scale(1)}
.bcount{color:var(--muted);font-size:14px;margin:0}
.prepQ{font-weight:600;margin:6px 0 14px}
.washTable{position:relative;height:250px;border-radius:24px;background:var(--soft);overflow:hidden;margin:0 0 12px}
.washTable .card{position:absolute;left:50%;top:50%;--cw:54px;margin:calc(var(--cw)*-.8) 0 0 calc(var(--cw)*-.5);transition:transform .6s cubic-bezier(.45,.05,.35,1)}
.washText{font-weight:700;margin:0 0 12px}
.pickBtns{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center}
.prepBtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
@media (max-width:640px){.washTable{height:210px}.bcircle{width:120px;height:120px}}

.thanks{max-width:40em;margin:28px 0 0;padding:24px 20px;border:2px dashed var(--line);border-radius:24px;text-align:center}
.thanks h3{font-size:20px;font-weight:800;margin:0 0 14px}
.fb{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.fb .opt{width:104px;padding:12px 4px 10px;font-size:14px}
.fb .opt .ic{width:64px;height:64px}
.fb .opt .ic svg{width:56px;height:56px}
.fbDone{animation:popIn .5s cubic-bezier(.3,.7,.2,1.4)}
.mascot-wrap{position:relative;width:150px;height:170px;margin:0 auto 6px}
.mascot{width:120px;height:150px;display:block;margin:10px auto 0;animation:bounce 1.1s ease-in-out infinite}
.mascot .wave{transform-origin:93px 80px;animation:wave .6s ease-in-out infinite alternate}
.spark{position:absolute;bottom:40px;font-size:18px;font-weight:800;opacity:0;animation:floatUp 2.4s ease-out infinite}
.s1{left:6px;animation-delay:.1s}.s2{left:26px;animation-delay:.9s;font-size:22px}.s3{right:4px;animation-delay:.5s}
.s4{right:24px;animation-delay:1.3s;font-size:14px}.s5{left:0;animation-delay:1.7s;font-size:14px}.s6{right:10px;animation-delay:2s;font-size:22px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.1) rotate(20deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.fbTitle{font-size:22px;font-weight:800;margin:4px 0 4px}
.fbMsg{margin:0 auto 16px;max-width:30em;color:var(--muted)}
.fbMore{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 18px;max-width:28em}
.fbMore textarea{width:100%;min-height:70px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;resize:vertical}

.quiz{max-width:640px;margin:0 auto;text-align:center}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.qdots{display:flex;gap:6px}
.qdots span{width:26px;height:8px;border-radius:99px;border:2px solid var(--line)}
.qdots span.on{background:var(--ink)}
.linkbtn{background:none;border:0;padding:4px 2px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.quiz h2{margin-bottom:4px}
.quiz .hint{margin-bottom:20px}
.quiz .field{max-width:320px;margin:0 auto 22px;text-align:left}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin-bottom:20px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:22px;padding:16px 8px 12px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.3;position:relative;transition:transform .15s cubic-bezier(.3,.7,.2,1.5),box-shadow .15s}
.opt:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:3px 3px 0 var(--line)}
.opt .ic{width:84px;height:84px;border-radius:50%;background:#FFF;display:grid;place-items:center;border:2px solid #111}
.opt .ic svg{width:76px;height:76px}
.opt[aria-pressed="true"]{box-shadow:4px 4px 0 var(--line);transform:translateY(-3px)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;display:grid;place-items:center}
.opt:active{transform:scale(.96)}
.hello{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;margin-bottom:14px;font-weight:700}
.hello .ic,.profile .ic{width:36px;height:36px;border-radius:50%;background:#FFF;border:2px solid #111;display:grid;place-items:center;flex:none}
.hello .ic svg,.profile .ic svg{width:30px;height:30px}
.profile{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0}
.profile .tag{border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;font-weight:600}
.moodmsg{max-width:40em;margin:14px 0 0;padding:10px 16px;border-radius:16px;background:var(--soft);font-weight:600}
@media (prefers-reduced-motion:reduce){.opt:hover,.opt[aria-pressed="true"]{transform:none}}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" data-i="brand"></button>
    <div class="top-r">
      <ol class="stepper" id="stepper" aria-hidden="true">

  <section id="guide" hidden>

  <section id="codex" hidden>
    <div class="cxhead"><h2 id="codexTitle"></h2><button class="btn" id="codexBack"></button></div>

    <p class="hint" id="codexEmpty" hidden></p>
    <div class="cxgrid" id="codexGrid"></div>

  <section id="intro">
    <div class="quiz">
      <div class="quiz-top"><div class="qdots" id="qdots" aria-hidden="true"></div><button class="linkbtn" id="skipBtn" data-i="skip"></button></div>
      <h2 id="qTitle"></h2>
      <p class="hint" id="qSub"></p>

      <div class="opts" id="opts" role="group"></div>
      <button class="linkbtn" id="backBtn" data-i="back"></button>

  <section id="setup" hidden>
    <div class="hero">
      <div>
        <div class="hello" id="hello"></div>
        <h1 id="h1"></h1>
        <p class="lede" data-i="lede"></p>
        <fieldset>
          <legend data-i="topicLegend"></legend>
          <div class="topics" id="topics"></div>
          <div id="situWrap" hidden><p class="subq" id="situQ"></p><div class="topics" id="situ"></div></div>
        </fieldset>
                <label class="field"><span data-i="qLabel"></span><textarea id="qText" maxlength="300"></textarea></label>
        <div class="qhelp" id="qHelp" aria-live="polite"></div>
        <div class="qchips" id="qChips"></div>
        <fieldset>
          <legend data-i="spreadLegend"></legend>
          <div class="spreads">
            <label><input type="radio" name="spread" value="single"><b id="sp-single"></b><small id="spd-single"></small></label>
            <label><input type="radio" name="spread" value="three" checked><b id="sp-three"></b><small id="spd-three"></small></label>
            <label><input type="radio" name="spread" value="celtic"><b id="sp-celtic"></b><small id="spd-celtic"></small></label>
          </div>
        </fieldset>
        <label class="check"><input type="checkbox" id="qRev" checked><span data-i="revLabel"></span></label>
        <button class="btn primary" id="shuffleBtn" data-i="shuffle"></button>
      </div>
      <div class="deckstage" aria-hidden="true"><div class="stack" id="stack"></div></div>
    </div>
  </section>

  <section id="prep" hidden>
    <div class="prep">
      <h2 id="prepTitle"></h2>
      <p class="hint" id="prepSub"></p>
      <p class="warn" id="prepWarn" hidden></p>
      <ul class="rules" id="prepRules"></ul>
      <div class="breath" id="breath">
        <div class="bcircle" id="bcircle"><span id="btext"></span></div>
        <p class="bcount" id="bcount"></p>
      </div>
      <p class="prepQ" id="prepQ"></p>
      <div class="washTable" id="washTable" aria-hidden="true"></div>
      <p class="washText" id="washText" hidden></p>
      <div class="prepBtns"><button class="btn" id="prepBack"></button><button class="btn primary" id="washBtn"></button></div>
    </div>
  </section>

  <section id="pick" hidden>
    <div class="pickhead">
      <h2 id="pickTitle"></h2>
      <span class="counter" id="counter"></span>
    </div>
    <p class="hint" data-i="hint"></p>
    <div class="fan" id="fan" role="group"></div>
    <div class="tray" id="tray" aria-hidden="true"></div>
    <div class="pickBtns"><button class="btn" id="undoBtn" disabled></button><button class="btn primary" id="toRead" hidden></button></div>
  </section>

  <section id="read" hidden>
    <h2 id="readTitle"></h2>
    <p class="question" id="readQ"></p>
    <div class="profile" id="profile"></div>
    <p class="moodmsg" id="moodMsg" hidden></p>
    <div class="board" id="board"></div>
    <div class="actions">
      <button class="btn" id="flipAll" data-i="flipAll"></button>
      <button class="btn" id="aiFreeBtn" hidden></button>
      <button class="btn" id="shareBtn"></button>
      <button class="btn" id="copyBtn" data-i="copy"></button>
      <button class="btn" id="againBtn" data-i="again"></button>
    </div>
    <div class="ai" id="aiFreeBox" hidden>
      <h3 id="aiFreeTitle"></h3>
      <div id="aiFreeOut"></div>
    </div>
    <div class="ai" id="sumBox" hidden>
      <h3 data-i="aiTitle"></h3>
      <div id="sumOut"></div>
    </div>
    <p class="note" id="healthNote" hidden data-i="healthNote"></p>
    <div class="reading" id="reading"></div>
    <section class="thanks" id="thanks" hidden>
      <h3 id="fbQ"></h3>
      <div class="fb" id="fbBtns" role="group"></div>
      <div class="fbDone" id="fbDone" hidden>
        <div class="mascot-wrap" aria-hidden="true">
          <svg class="mascot" viewBox="0 0 120 150"><g stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M48 124 L44 142 M72 124 L76 142" fill="none"/><path d="M38 143 H50 M70 143 H82" fill="none"/>
            <path d="M27 84 Q14 92 10 104" fill="none"/>
            <g class="wave"><path d="M93 80 Q106 70 110 54" fill="none"/><circle cx="111" cy="50" r="4.5" fill="#FFF"/></g>
            <rect x="25" y="14" width="70" height="112" rx="14" fill="#FFF"/>
            <rect x="32" y="21" width="56" height="98" rx="9" fill="none" stroke-width="2"/>
            <path d="M60 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#111" stroke="none"/>
            <path d="M44 66 q5 -6 10 0 M66 66 q5 -6 10 0" fill="none"/>
            <ellipse cx="42" cy="76" rx="5" ry="3" fill="#111" opacity=".2" stroke="none"/><ellipse cx="78" cy="76" rx="5" ry="3" fill="#111" opacity=".2" stroke="none"/>
            <path d="M51 78 Q60 90 69 78 Z" fill="#111"/>
          </g></svg>
          <span class="spark s1">✦</span><span class="spark s2">♡</span><span class="spark s3">✦</span><span class="spark s4">★</span><span class="spark s5">♡</span><span class="spark s6">✦</span>
        </div>
        <p class="fbTitle" id="fbTitle"></p>
        <p class="fbMsg" id="fbMsg"></p>
        <div class="fbMore" id="fbMore" hidden>
          <textarea id="fbComment" maxlength="500"></textarea>
          <button class="btn" id="fbSend"></button>
        </div>
        <button class="btn primary" id="fbAgain"></button>
      </div>
    </section>
  </section>

  <p class="foot" data-i="foot"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden><div class="modalCard" role="dialog" aria-modal="true"><div id="modalBody"></div><button class="btn" id="modalClose"></button></div></div>
<script>
const ZH_MAJORS = `愚者|The Fool|新開始、冒險、自由|帶著好奇心踏出第一步，不必想得太周全。|魯莽、猶豫、逃避責任|衝動或害怕都讓你停在原地，先看清腳下。
魔術師|The Magician|行動力、資源、創造|你手上的工具已經足夠，是時候動手。|欺瞞、分心、能力未發揮|注意言過其實，或把力氣用錯地方。
女祭司|The High Priestess|直覺、潛意識、靜觀|答案在內心，安靜下來聽自己的聲音。|忽視直覺、秘密、混亂|你可能在壓抑內在感受，或有話沒被說出口。
皇后|The Empress|豐盛、滋養、感官|耐心照顧的事物正在開花結果。|過度付出、停滯、忽略自己|付出太多，而忘了照顧自己。
皇帝|The Emperor|秩序、權威、穩定|建立結構與規則，能讓局面穩住。|控制、僵化、濫用權力|掌控得太緊，反而讓事情卡住。
教皇|The Hierophant|傳統、學習、指引|向有經驗的人或既有體制求教。|打破常規、教條、叛逆|你開始質疑規則，想走自己的路。
戀人|The Lovers|愛、結合、價值選擇|一個與真心相符的選擇擺在眼前。|失衡、猶豫、價值衝突|關係或抉擇中，彼此的期待不一致。
戰車|The Chariot|意志、前進、勝利|專注目標，靠決心駕馭矛盾的力量。|失控、方向不明、受阻|力氣四散，需要重新確認方向。
力量|Strength|勇氣、耐心、溫柔的堅定|以柔克剛，溫和而堅定就能化解難題。|自我懷疑、軟弱、情緒失控|內在力量被恐懼蓋過了，先善待自己。
隱者|The Hermit|內省、獨處、尋找答案|暫時退後一步，獨處能帶來洞見。|孤立、封閉、逃避|獨處過了頭，變成與人隔絕。
命運之輪|Wheel of Fortune|轉機、循環、時機|局勢正在轉動，順勢而為。|不順、抗拒改變、停滯|事情不如預期，但輪子終究會再轉。
正義|Justice|公平、真相、因果|誠實面對，事情會得到公正的結果。|不公、逃避責任、偏頗|有些事被扭曲，或你不願承認自己的部分。
倒吊人|The Hanged Man|等待、換個角度、放下|暫停下來，換個視角會看到新可能。|拖延、無謂犧牲、抗拒|困在原地，卻不肯鬆手。
死神|Death|結束、轉化、新生|一個階段結束，為新的開始騰出空間。|抗拒結束、停滯、害怕改變|緊抓著已經過去的東西不放。
節制|Temperance|平衡、調和、耐心|找到中間的路，慢慢調和。|失衡、過度、急躁|某方面用力過猛，需要調整節奏。
惡魔|The Devil|束縛、慾望、執著|看清是什麼綁住了你，往往是自己解得開的鎖。|掙脫、覺醒、擺脫依賴|你正在意識到束縛，開始鬆綁。

月亮|The Moon|不安、迷霧、潛意識|事情還不明朗，別急著下定論。|釐清、恐懼消散、真相浮現|迷霧漸散，看清原本誤解的地方。

const ZH_MINORS = {
wands:`新靈感、熱情、開創|一股想做點什麼的衝勁正在點燃。|延誤、缺乏動力、方向不明|熱情還沒找到出口。

慶祝、安定、歸屬|值得慶祝的里程碑，感受團聚的溫暖。|不安定、過渡期、不和諧|表面熱鬧，底下還有沒解決的事。
競爭、衝突、磨合|意見紛雜，是摩擦也是成長。|避免衝突、內耗、和解|衝突轉向內部，或終於願意停戰。
勝利、肯定、自信|努力被看見，好好接受掌聲。|自負、失去肯定、落差|太在意別人的評價。
堅守立場、防衛、挑戰|站穩你的位置，這值得捍衛。|疲於應付、退讓、不堪負荷|撐得太累，開始想放棄。
快速進展、消息、行動|事情加速推進，消息即將到來。|延誤、倉促、混亂|節奏亂了，慢下來反而更快。
韌性、戒備、最後堅持|雖然疲憊，但只差一點了。|精疲力竭、多疑、放棄|防備心太重，身心都在透支。
負擔、責任、壓力|你扛了太多，該分出去一些。|放下重擔、崩潰、委派|開始學著卸下不必要的責任。
好奇、探索、好消息|帶著熱情嘗試新事物。|三分鐘熱度、壞消息、猶豫|興趣來得快，去得也快。
冒險、衝勁、熱情|大膽追求，行動派的能量。|魯莽、急躁、半途而廢|衝太快，容易虎頭蛇尾。
自信、魅力、獨立|散發溫暖而堅定的光芒。|嫉妒、自我懷疑、強勢|缺乏安全感時，容易變得咄咄逼人。
領導、遠見、魄力|用願景帶著大家前進。|專斷、急躁、期待過高|要求太高，忽略了別人的步調。`,
cups:`新感情、愛、情感豐沛|心打開了，新的情感正在流入。|情感壓抑、空虛、封閉|有些情緒還沒被好好接住。
連結、夥伴、相互吸引|兩人之間有真誠的共鳴。|失和、誤解、關係失衡|互動中出現了不對等。
友誼、慶祝、社群|和朋友分享喜悅。|過度放縱、八卦、疏離|社交帶來消耗，或小圈子出現摩擦。
冷淡、沉思、錯過機會|對眼前提不起勁，但別忽略新的提議。|重新投入、接受機會|從倦怠中醒來，願意再試一次。
失落、遺憾、悲傷|只盯著失去的，卻沒看到身後還在的。|釋懷、接受、走出傷痛|開始放下，轉身看見留下的東西。
懷舊、純真、回憶|過去的人事物帶來溫暖。|活在過去、不願長大|太留戀過去，走不出去。

function polarity(p){
  const base = p.card.major ? POL_MAJOR[p.card.idx] : POL_MINOR[p.card.suit][p.card.idx];
  if(!p.reversed) return base;
  return base===1 ? -0.3 : base===-1 ? 0.3 : -0.3;
}

function qChecks(q){
  const s = q.trim(), en = LANG==='en';
  const long = en ? s.split(/\s+/).filter(Boolean).length>=6 : s.replace(/\s/g,'').length>=10;
  const time = /月|週|周|年|天|最近|接下來|今年|明年|下個|這個|這段|month|week|year|soon|next|this|lately|recent/i.test(s);
  const open = /怎麼|如何|什麼|哪|為什麼|how|what|which|why/i.test(s);
  return {long, time, open, yesno: detectIntent(s).yesno && !open, blank: s.includes('___')};
}

function repeatInfo(){
  if(!S.question) return null;

  const hit = loadHist().filter(x=>x.q===n && Date.now()-x.t < 30*864e5).sort((a,b)=>b.t-a.t)[0];
  if(!hit) return null;
  const days = Math.floor((Date.now()-hit.t)/864e5);
  const until = new Date(hit.t + 30*864e5).toLocaleDateString(LANG==='en'?'en-US':'zh-TW',{month:'long',day:'numeric'});
  return {days, until};
}

function timeFrame(){
  const q = S.question||'';
  if(LANG==='zh'){
    const m = q.match(/([一二三四五六七八九十兩半\d]+)\s*(個)?\s*(月|週|周|星期|年|天)/);
    if(m) return `接下來這${m[1]}${m[2]||(/月/.test(m[3])&&!/半/.test(m[1])?'個':'')}${m[3]}`;
    if(/今年/.test(q)) return '今年'; if(/明年/.test(q)) return '明年'; if(/最近|這陣子/.test(q)) return '這陣子';
    return NR.zh.timeDefault;
  }
  const m = q.match(/(next|coming|few)\s+((?:\w+\s+)?(?:days?|weeks?|months?|years?))/i);
  if(m) return `Over the ${m[1].toLowerCase()==='few'?'next few':'next'} ${m[2]}`.replace('next next','next');
  if(/this year/i.test(q)) return 'This year'; if(/lately|recently/i.test(q)) return 'Lately';
  return NR.en.timeDefault;
}

    return `In ${d}, ${base.charAt(0).toLowerCase()+base.slice(1)}.`;

function qOptions(){
  const q = (S.question||'').replace(/[？?。.!！]+$/,'').trim(); let m;
  if(LANG==='zh' && (m = q.match(/(?:要|該|選|是)?([^，,、]{1,14}?)(?:還是|或是|或者)([^，,、]{1,14})$/))) return [m[1].replace(/^(我)?(應該|要|該|選擇?)/,''), m[2]];
  if(LANG==='en' && (m = q.match(/(?:should i|do i|is it|choose|pick)?\s*([^,]{2,40}?)\s+or\s+([^,]{2,40})$/i))) return [m[1].trim(), m[2].trim()];
  return null;
}
const QL = {

function localReading(){
  const T = NR[LANG], pos = positions(), P = S.picks, n = P.length, topic = S.topic||'general';
  const sp = LANG==='en'?' ':'', out = [], D = DEEP[LANG], G = GOAL_TXT[LANG], goal = S.profile.goal;
  const oWord = p => LANG==='en' ? (p.reversed?'reversed':'upright') : (p.reversed?'逆位':'正位');
  const nm = p => LANG==='en' ? cardName(p.card).replace(/^The /,'') : cardName(p.card);
  // challenge card = most difficult energy
  const ranked = P.map((p,i)=>({p,i,v:polarity(p)})).sort((a,b)=>a.v-b.v || (b.p.reversed-a.p.reversed) || a.i-b.i);
  const hard = ranked[0], hasHard = hard.v < 0;
  const key = P[n-1], dom = T.dom[topic];
  // 1. hook
  const tf = timeFrame();
  if(hasHard){ const el = elOf(hard.p.card), o = hard.p.reversed?1:0;
    const o2 = hard.p.reversed?1:2, ex = (o2===2 ? T.explainHard[el] : T.explain[el][1]).replace('{d}', LANG==='en'?EN_DOM_IN[topic]:dom); out.push(T.hook(tf, dom, T.surface[topic], T.real[el][o2], ex)); }
  else { const el = elOf(key.card); out.push(T.hookGood(tf, dom, T.surface[topic], T.explain[el][0].replace('{d}', LANG==='en'?EN_DOM_IN[topic]:dom))); }
  const intent = detectIntent(S.question);
  if(S.question){ const pre = QL[LANG].prefix(S.question); out[0] = pre + (LANG==='en' ? out[0].charAt(0).toLowerCase()+out[0].slice(1) : out[0]); }
  if(goal==='answer') out.unshift(G.answer[polCat(key)]);
  // 2. story (all but the final card)
  if(n===1){
    const p = P[0], el = elOf(p.card), o = p.reversed?1:0;
    out.push(T.single(oWord(p), nm(p), kwPhrase(p), narrStory(p), implyFor(p), betterLine(p)));
  } else {
    const idxs = S.spread==='celtic' ? [0,1,3,5,8] : P.map((_,i)=>i).slice(0,n-1);
    const story = idxs.map((i,k)=>{ const p = P[i], el = elOf(p.card), o = p.reversed?1:0;
      return T.card(T.cardLead[Math.min(k,2)], pos[i], oWord(p), nm(p), kwPhrase(p)) + sp + narrStory(p) + sp + implyFor(p); });
    // combinations
    const combos = [];
    const revs = P.map((p,i)=>({p,i})).filter(x=>x.p.reversed);
    if(revs.length>=2) combos.push(T.loop(revs.length, firstKw(revs[0].p), firstKw(revs[1].p)));
    else if(revs.length===1){ const up = P.map((p,i)=>({p,i})).find(x=>!x.p.reversed && x.i!==revs[0].i);
      if(up) combos.push(T.balance(pos[Math.min(up.i,revs[0].i)], pos[Math.max(up.i,revs[0].i)], firstKw(up.p), firstKw(revs[0].p))); }
    const counts = {}; P.forEach(p=>{ if(!p.card.major) counts[p.card.suit]=(counts[p.card.suit]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if(top && top[1]>=2 && combos.length<2) combos.push(T.sameSuit(SUIT_NAMES[top[0]][LANG], focused()? (LANG==='en'?EN_SUIT_TOPIC:ZH_SUIT_TOPIC)[top[0]][TOPIC_KEYS.indexOf(topic)] + (LANG==='en'?'.':'。') : SUM[LANG].suit[top[0]]));
    const majors = P.filter(p=>p.card.major).length;
    if(n>=3 && majors>=2 && combos.length<2) combos.push(T.majors(majors));
    // background
    const bg = [];
    const si = situation(); if(si) bg.push(si[LANG].frame);
    const rel = S.profile.rel;
    if(topic==='love'){ if(!si && rel && SUM[LANG].rel[rel]) bg.push(SUM[LANG].rel[rel]); }
    else if(rel){ const tie = T.tie[topic]; if(tie){ const t2 = rel==='single' ? tie[1] : (T.relName[rel] ? tie[0](T.relName[rel]) : ''); if(t2) bg.push(t2); } }
    out.push([...story, ...combos, ...bg].join(sp));
    const opts = qOptions();
    if(opts && n>=2){ const L2 = QL[LANG], pa=P[0], pb=P[1], va=polarity(pa), vb=polarity(pb);
      const desc = p => (LANG==='en'?`${oWord(p)} ${nm(p)}`:`${oWord(p)}${nm(p)}`);
      out.push(L2.choice(opts[0],opts[1],pos[0],desc(pa),pos[1],desc(pb), va===vb ? L2.choiceEven : L2.choiceBetter(va>vb?opts[0]:opts[1]))); }
    // 3. final card
    const c = polCat(key), o = key.reversed?1:0, fp = pos[n-1];
    const st = narrStory(key), b = betterLine(key);
    out.push((c==='pos'?T.finalGood:c==='neg'?T.finalBad:T.finalMid)(fp, oWord(key), nm(key), st, b));
  }
  // 4. concrete advice
  const acts = ACT_RAW[LANG][topic] || ACT_RAW[LANG].general;
  const e1 = elOf(hard.p.card), e2 = elOf(key.card);
  const kw = qKeyword();
  let a1 = acts[e1][0], a2 = e2!==e1 ? acts[e2][0] : acts[e1][1];
  if(kw){ out.push(QL[LANG].kw(kw.label, polCat(key))); a2 = a1; a1 = kw.adv; }
  const moodLine = S.profile.mood ? T.mood[S.profile.mood] : '';
  out.push(T.advice(a1, a2, moodLine).trim());
  if(S.question){ const V = QL[LANG].verdict; let v;
    const o3 = n>=2 ? qOptions() : null;
    if(o3){ const va=polarity(P[0]), vb=polarity(P[1]); v = va===vb ? V.choiceEven : V.choice(va>vb?o3[0]:o3[1]); }
    else if(intent.yesno && !intent.choice) v = V[yesnoKey(key)];
    else if(intent.when) v = DEEP[LANG].when[key.card.major?'major':key.card.suit].replace(/^關於時間：|^On timing: /,'');
    else if(/為什麼|為何|\bwhy\b/i.test(S.question)) v = V.why(hasHard ? T.real[elOf(hard.p.card)][hard.p.reversed?1:2] : T.real[elOf(key.card)][0]);
    else if(/怎麼|如何|該|\bhow\b|what should/i.test(S.question)) v = V.how(a1);
    else v = V[polCat(key)];
    out.push(QL[LANG].back(S.question) + v); }
  if(goal==='comfort'){ out.unshift(G.comfortStart); out.push(G.comfortEnd); }
  return out;
}

function svgImage(svgStr, w, h){
  return new Promise((res,rej)=>{
    const s = svgStr.replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `);
    const url = URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
    const img = new Image(); img.onload = ()=>{ res(img); setTimeout(()=>URL.revokeObjectURL(url),1000); }; img.onerror = rej; img.src = url;
  });
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapText(ctx, text, maxW){
  const lines = []; let line = '';
  const tokens = LANG==='en' ? text.split(/(\s+)/) : Array.from(text);
  const noStart = /^[，。、」』）？！：；…,.!?;:)”’]/;
  for(const tk of tokens){ const test = line + tk; if(ctx.measureText(test).width > maxW && line.trim() && !noStart.test(tk)){ lines.push(line.trim()); line = tk.trimStart(); } else line = test; }
  if(line.trim()) lines.push(line.trim()); return lines;
}
const FONT = '"Nunito","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif';
async function drawCardOn(ctx, card, reversed, cx, cy, w){
  const h = w*1.6, x = -w/2, y = -h/2;
  const art = await svgImage(cardArt(card), Math.round(w*0.88), Math.round(h*0.66));
  ctx.save(); ctx.translate(cx, cy); if(reversed) ctx.rotate(Math.PI);
  ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=w*0.06; ctx.shadowOffsetY=w*0.02;
  rr(ctx,x,y,w,h,w*0.12); ctx.fillStyle='#FFF'; ctx.fill(); ctx.shadowColor='transparent';
  ctx.lineWidth = Math.max(3,w*0.022); ctx.strokeStyle='#111'; ctx.stroke();
  rr(ctx,x+w*0.04,y+w*0.04,w-w*0.08,h-w*0.08,w*0.09); ctx.lineWidth=Math.max(1.5,w*0.006); ctx.stroke();
  ctx.fillStyle='#111'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `800 ${Math.round(w*0.085)}px Georgia,"Times New Roman",serif`; ctx.fillText(`✦ ${card.mark[LANG]} ✦`, 0, y+h*0.075);
  ctx.drawImage(art, x+w*0.06, y+h*0.12, w*0.88, h*0.66);
  ctx.font = `800 ${Math.round(w*(LANG==='en'?0.062:0.08))}px ${FONT}`;
  const name = cardName(card), tw = Math.min(w*0.86, ctx.measureText(name).width + w*0.14), ph = w*0.13;
  rr(ctx,-tw/2,y+h*0.86-ph/2,tw,ph,ph/2); ctx.fill(); ctx.fillStyle='#FFF'; ctx.fillText(name, 0, y+h*0.86, w*0.8);
  ctx.restore();
}
async function makeShareImage(){
  try{ await document.fonts.ready; }catch{}
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), sp = SPREADS[S.spread][LANG].name, pos = positions();
  ctx.fillStyle='#FFF'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#111'; for(let i=0;i<220;i++){ const x=(i*97)%W, y=(i*233)%H; if(y>140&&y<1780&&x>80&&x<1000) continue; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill(); }
  rr(ctx,40,40,W-80,H-80,56); ctx.lineWidth=6; ctx.strokeStyle='#111'; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#111';
  ctx.font = `800 64px ${FONT}`; ctx.fillText(`✦ ${t().brand}`, W/2, 160);
  ctx.font = `600 34px ${FONT}`; ctx.fillStyle='#666';
  ctx.fillText(`${TOPICS[S.topic][LANG].name}${LANG==='en'?' · ':'｜'}${sp}`, W/2, 230);

    ctx.font = `700 42px ${FONT}`; ctx.fillStyle='#111';

    const lines = wrapText(ctx, q, W-220).slice(0,3);
    const bh = lines.length*58 + 50; rr(ctx,100,y,W-200,bh,32); ctx.fillStyle='#F1F1F1'; ctx.fill(); ctx.fillStyle='#111';
    lines.forEach((l,i)=>ctx.fillText(l, W/2, y+25+29+i*58)); y += bh + 50;
  } else y += 20;
  let idx = S.picks.map((_,i)=>i); if(idx.length>3) idx = [0,1,idx.length-1];
  const n = idx.length, cw = n===1 ? 380 : n===2 ? 320 : 280, gap = 40, total = n*cw + (n-1)*gap, ch = cw*1.6;
  for(let k=0;k<n;k++){ const i = idx[k], p = S.picks[i], cx = (W-total)/2 + cw/2 + k*(cw+gap), cy = y + ch/2;
    await drawCardOn(ctx, p.card, p.reversed, cx, cy, cw);
    ctx.font = `700 32px ${FONT}`; ctx.fillStyle='#111'; ctx.fillText(pos[i], cx, y+ch+44);
    if(p.reversed){ ctx.font = `600 26px ${FONT}`; ctx.fillStyle='#777'; ctx.fillText(LANG==='en'?'reversed':'逆位', cx, y+ch+82); } }
  y += ch + (idx.some(i=>S.picks[i].reversed) ? 150 : 120);
  ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.setLineDash([6,8]); ctx.beginPath(); ctx.moveTo(110,y-34); ctx.lineTo(W-110,y-34); ctx.stroke(); ctx.setLineDash([]); y += 14;
  // short meaning of each card, tied to the topic
  ctx.textAlign='left';
  const left = 110, maxW = W - 220, bottomLimit = H - 420;
  for(const i of idx){
    const p = S.picks[i];
    ctx.font = `800 34px ${FONT}`; ctx.fillStyle='#111';
    const head = LANG==='en' ? `${pos[i]} · ${cardName(p.card)}${p.reversed?' (reversed)':''}` : `${pos[i]}｜${cardName(p.card)}${p.reversed?'（逆位）':''}`;
    ctx.fillText(head, left, y); y += 46;
    ctx.font = `500 31px ${FONT}`; ctx.fillStyle='#444';
    const ls = wrapText(ctx, shortMeaning(p), maxW).slice(0,2);
    ls.forEach(l=>{ ctx.fillText(l, left, y); y += 42; });
    y += 18;
    if(y > bottomLimit) break;
  }
  // direct answer to the question
  const ans = shareAnswer();
  if(ans){
    y += 10; ctx.font = `700 36px ${FONT}`;
    let al = wrapText(ctx, ans, maxW - 40);
    const maxL = Math.max(2, Math.floor((H - 200 - y - 40)/52)); if(al.length>maxL){ al = al.slice(0,maxL); al[maxL-1] = al[maxL-1].replace(/.{1,2}$/,'⋯'); }
    const bh = al.length*52 + 40; rr(ctx, left-20, y-8, W-2*(left-20), bh, 28); ctx.fillStyle='#111'; ctx.fill();
    ctx.fillStyle='#FFF'; ctx.textBaseline='top'; al.forEach((l,k)=>ctx.fillText(l, left+10, y+14+k*52)); ctx.textBaseline='middle';
  }
  ctx.textAlign='center'; ctx.font = `700 32px ${FONT}`; ctx.fillStyle='#111';
  const site = /^https?:/.test(location.href) && !/claude|usercontent/.test(location.host) ? (location.host + location.pathname).replace(/\/(index\.html)?$/,'') : 'sabinachou.github.io/tarot';
  ctx.fillText(`${SH[LANG].tag} ✦ ${site}`, W/2, H-110);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/png'));
}
function shortMeaning(p){
  const c = p.card, kw = kwShort(p), sep = LANG==='en' ? ': ' : '：';
  if(!focused()){ return kw + sep + meaning(p)[1]; }
  const k = TOPIC_KEYS.indexOf(S.topic);
  const base = c.major ? (LANG==='en'?EN_MAJOR_TOPIC:ZH_MAJOR_TOPIC)[c.idx][k] : RANK_TOPIC[LANG][c.idx][k];
  if(!p.reversed) return kw + sep + base + (LANG==='en'?'.':'。');
  return kw + sep + (diff(p) ? (LANG==='en'?`stuck right now around “${base}.”`:`「${base}」這部分目前卡住了。`) : (LANG==='en'?`easing up: ${base}.`:`正在好轉，${base}。`));
}
function shareAnswer(){
  const out = localReading(), backPre = S.question ? QL[LANG].back(S.question) : null;
  if(backPre){ const line = out.find(x=>x.startsWith(backPre)); if(line){ return (LANG==='en'?'Answer: ':'回到你的問題：') + line.slice(backPre.length); } }
  const hook = (out.find(x=>/課題其實不是|challenge isn’t really/.test(x))||'');
  const first = LANG==='en' ? (hook.match(/[^.]*challenge isn’t really[^.]*\.[^.]*\./)||[''])[0].trim() : (hook.match(/[^。]*課題其實不是[^。]*。/)||[''])[0];
  return first.replace(/^.*?從牌面來看，/,'');
}

    list:[['Death isn’t literal death','it marks the end of a chapter and a transformation that makes room for something new.'],['The Tower isn’t the end of the world','it’s sudden change that breaks what was shaky so the truth can come out.'],['Reversed cards aren’t bad cards','they point to where you feel stuck.'],['Tarot doesn’t decide your life','the cards offer direction and reminders; what you do is always up to you.']]}
  ]}
};
let guidePrev = 'intro';
function renderGuide(){
  const G = GUIDE[LANG], body = $('guideBody'); body.innerHTML='';
  $('guideTitle').textContent = G.title; $('guideBack').textContent = G.back;
  const intro = document.createElement('p'); intro.className='lede'; intro.textContent = G.intro; body.appendChild(intro);
  const toc = document.createElement('div'); toc.className='cxfilters';
  G.secs.forEach(sec=>{ const b=document.createElement('button'); b.className='cxf'; b.textContent=sec.h.replace(/[：:（(].*$/,'');
    b.addEventListener('click',()=>document.getElementById('g-'+sec.id).scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'})); toc.appendChild(b); });
  body.appendChild(toc);
  G.secs.forEach(sec=>{
    const s = document.createElement('section'); s.className='gsec'; s.id='g-'+sec.id;
    const h = document.createElement('h3'); h.textContent = sec.h; s.appendChild(h);
    if(sec.cards){ const row=document.createElement('div'); row.className='gcards';
      sec.cards.forEach(id=>{ const c = CARDS.find(x=>x.id===id); const w=document.createElement('div'); w.className='gcard';
        const el = cardEl('div', c, false); el.classList.add('flipped'); w.appendChild(el);
        const cap=document.createElement('span'); cap.textContent=cardName(c); w.appendChild(cap); row.appendChild(w); });
      s.appendChild(row); }
    (sec.p||[]).forEach(t=>{ const p=document.createElement('p'); p.textContent=t; s.appendChild(p); });
    if(sec.list){ const dl=document.createElement('dl'); dl.className='glist';
      sec.list.forEach(([k,v])=>{ const dt=document.createElement('dt'); dt.textContent=k; const dd=document.createElement('dd'); dd.textContent=v; dl.append(dt,dd); }); s.appendChild(dl); }
    if(sec.ol){ const ol=document.createElement('ol'); ol.className='gol'; sec.ol.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ol.appendChild(li); }); s.appendChild(ol); }
    if(sec.after){ const p=document.createElement('p'); p.textContent=sec.after; s.appendChild(p); }
    body.appendChild(s);
  });
  const cta = document.createElement('div'); cta.className='pickBtns';
  const a = document.createElement('button'); a.className='btn primary'; a.textContent=G.start; a.addEventListener('click',startIntro);
  const b = document.createElement('button'); b.className='btn'; b.textContent=G.codex; b.addEventListener('click',openCodex);
  cta.append(a,b); body.appendChild(cta);
}
function openGuide(){ if(S.stage!=='guide') guidePrev = S.stage; renderGuide(); show('guide'); }

/* ---------- Copy ---------- */
function readingText(){
  const sp = SPREADS[S.spread], pos = positions(), L = t();
  const colon = LANG==='en'?': ':'：';
  const lines = [`${L.copyTitle}${LANG==='en'?' | ':'｜'}${S.name||''}`.replace(/[｜|]\s*$/,'').trim(),
                 `${L.copyTopic}${colon}${TOPICS[S.topic][LANG].name}`];
  const tags=['rel','mood','goal'].filter(k=>S.profile[k]).map(k=>optLabel(k,S.profile[k],LANG));
  if(situation()) tags.push(situation()[LANG].label);
  if(tags.length) lines.push(tags.join(LANG==='en'?', ':'、'));
  if(S.question) lines.push(L.qPrefix+S.question);
  lines.push(L.spreadPrefix+sp[LANG].name,'');
  S.picks.forEach((p,i)=>{
    if(!S.flipped.has(i)) return;
    const m = meaning(p);
    lines.push(`${i+1}. ${pos[i]}${colon}${cardName(p.card)} (${p.reversed?L.rev:L.up})`,`   ${m[0]}`,`   ${m[1]}`);
    const tl = topicLine(p.card,p.reversed,S.topic); if(tl) lines.push(`   ${L.topicPrefix(TOPICS[S.topic][LANG].name)}${tl}`);
  });
  if(aiFreeText) lines.push('',`[${AI_TXT[LANG].title}]`,aiFreeText);
  if(allFlipped()) lines.push('',`[${L.copyAI}]`,localReading().join('\n\n'));
  if(S.topic==='health') lines.push('','* '+L.healthNote);
  return lines.join('\n');
}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
$('copyBtn').addEventListener('click',async()=>{
  if(!S.flipped.size){toast(t().flipFirst);return}
  const text = readingText();
  try{ await navigator.clipboard.writeText(text); toast(t().copied); }
  catch{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ok=document.execCommand('copy')}catch{}
    ta.remove(); toast(ok?t().copied:t().copyFail);
  }
});
$('againBtn').addEventListener('click',startIntro);
$('home').addEventListener('click',startIntro);

$('codexBtn').addEventListener('click',openCodex);
$('guideBtn').addEventListener('click',openGuide);
$('guideLink').addEventListener('click',openGuide);
$('guideBack').addEventListener('click',()=>show(guidePrev||'intro'));
$('codexBack').addEventListener('click',()=>show(codexPrev||'intro'));
$('modalClose').addEventListener('click',closeModal);
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('modal').hidden) closeModal(); });
$('shareBtn').addEventListener('click',shareImage);
applyLang();
show('intro');
</script>
